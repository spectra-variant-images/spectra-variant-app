services:
  # Web Service
  - type: web
    name: spectra-app
    env: node
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_APP_URL
        value: https://spectra-app-fb05.onrender.com
      - key: SCOPES
        value: read_products,write_products,read_product_listings,write_product_listings,read_inventory,write_inventory,read_orders,write_orders,read_customers,write_customers,read_content,write_content
    disk:
      name: data
      mountPath: /opt/render/project/data
      sizeGB: 1
