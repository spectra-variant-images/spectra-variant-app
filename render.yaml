services:
  # Web Service
  - type: web
    name: spectra-app
    env: node
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        value: https://spectra-app.onrender.com
      - key: SCOPES
        value: write_products,write_product_listings,read_product_listings,read_inventory
      - key: DATABASE_URL
        fromDatabase:
          name: spectra-db
          property: connectionString
    disk:
      name: data
      mountPath: /opt/render/project/data
      sizeGB: 1

databases:
  # PostgreSQL Database
  - name: spectra-db
    databaseName: spectra
    user: spectra
